name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install Java 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Update apt
      run: sudo apt update && sudo apt install -y build-essential ccache libncurses5:i386 libstdc++6:i386 zlib1g:i386
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install kivy==2.1.0 buildozer==1.5.0 cython==0.29.36
    
    - name: Build APK
      run: |
        buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: rollcall-apk
        path: bin/*.apk
